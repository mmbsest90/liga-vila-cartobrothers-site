name: Atualizar classificacao

# Roda sozinho de 2 em 2 horas, e tambem pelo botao "Run workflow".
# Quando nao ha rodada rolando, ele confere e encerra em segundos.
# Ja foi de 30 em 30 minutos, mas o GitHub estrangula cron de alta frequencia
# e as execucoes saiam a cada ~6 horas, em horarios imprevisiveis.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Recoletar todas as rodadas do zero (demora ~10 min)"
        type: boolean
        default: false

# permite ao workflow gravar de volta no repositorio e publicar no Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-liga
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar e gerar a pagina
        id: coleta
        run: |
          if [ "${{ inputs.forcar }}" = "true" ]; then
            python3 coletor.py --forcar
          else
            python3 coletor.py
          fi

      # Sempre grava: o coletor guarda em saida/ quais rodadas ainda estao como
      # parcial e quando foi a ultima revisao. Se esse estado nao for commitado,
      # ele se perde entre execucoes. O git ja pula sozinho quando nada mudou.
      - name: Guardar os dados coletados
        run: |
          git config user.name  "Liga Vila Cartobrothers"
          git config user.email "acoes@users.noreply.github.com"
          git add saida site
          if git diff --cached --quiet; then
            echo "Nada mudou nesta execucao."
          else
            git commit -m "Atualiza classificacao - $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Preparar a publicacao
        if: steps.coleta.outputs.mudou == 'sim'
        uses: actions/configure-pages@v5

      - name: Empacotar a pagina
        if: steps.coleta.outputs.mudou == 'sim'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        if: steps.coleta.outputs.mudou == 'sim'
        uses: actions/deploy-pages@v4
